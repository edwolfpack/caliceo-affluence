name: Collecte affluence Calicéo

on:
  # La cadence ne dépend plus des crons : GitHub les retarde de plusieurs
  # heures (du 28/10 au 09/11, premier run du jour entre 12h et 15h Paris,
  # matinées toutes vides). Chaque run relance lui-même le suivant par
  # workflow_dispatch (démarrage immédiat) juste avant son échéance : la
  # chaîne tourne 24h/24 et ne relève que pendant l'ouverture.
  # Ce cron n'est qu'un secours pour relancer la chaîne si elle casse ;
  # grâce au bloc concurrency, il ne crée jamais de second run en parallèle.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}  # relance de la chaîne, ou lancement manuel

permissions:
  contents: write
  actions: write  # pour relancer le run suivant

concurrency:
  group: collecte-affluence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Relever toutes les 30 minutes (:07 et :37)
        timeout-minutes: 340
        run: |
          git config user.name "Collecteur Calicéo"
          git config user.email "actions@users.noreply.github.com"
          deadline=$(( $(date +%s) + 5*3600 + 30*60 ))
          # Pousse le dernier commit ; en cas de rejet, se recale sur main
          # (data/readings.csv est en merge=union, voir .gitattributes) puis
          # réessaie. Ne doit JAMAIS faire échouer le run : un échec ici
          # arrêtait toute la collecte (cas du 25/10 à 18h07 UTC).
          push_reading() {
            for try in 1 2 3; do
              git push -q origin HEAD:main && return 0
              git fetch -q origin main
              git rebase origin/main || git rebase --abort
            done
            return 1
          }
          while :; do
            # Attend le prochain créneau (:07 ou :37) AVANT de relever : un run
            # qui prend le relais ne relève donc jamais hors cadence ni en double.
            m=$(date +%-M); s=$(date +%-S)
            if   [ "$m" -lt 7 ];  then wait=$(( 7 - m ))
            elif [ "$m" -lt 37 ]; then wait=$(( 37 - m ))
            else wait=$(( 67 - m )); fi
            # Le créneau tomberait après l'échéance : le run suivant le prendra.
            if [ $(( $(date +%s) + wait*60 - s )) -ge "$deadline" ]; then
              echo "Échéance atteinte, le run suivant prend le relais."
              break
            fi
            sleep $(( wait*60 - s ))
            # Heure de Paris (HHMM) : suit seule le changement d'heure.
            # collect.py applique ensuite la fermeture exacte du jour.
            paris=$(( 10#$(TZ=Europe/Paris date +%H%M) ))
            if [ "$paris" -lt 1030 ] || [ "$paris" -ge 2240 ]; then
              echo "Bains fermés ($paris), pas de relevé."
              continue
            fi
            # Repart de l'état réel de main (un autre run a pu pousser entre-temps).
            git fetch -q origin main && git reset -q --hard origin/main \
              || echo "synchronisation impossible, on continue."
            python scripts/collect.py || echo "collect.py a échoué, on continue."
            if ! git diff --quiet -- data/readings.csv; then
              git add data/readings.csv
              git commit -q -m "Relevé affluence $(date -u +'%Y-%m-%d %H:%M UTC')"
              push_reading || echo "push échoué, nouvelle tentative au prochain relevé."
            fi
          done

      - name: Relancer le run suivant
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for try in 1 2 3; do
            gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref main && exit 0
            sleep 10
          done
          echo "Relance impossible : le cron de secours reprendra la chaîne."
