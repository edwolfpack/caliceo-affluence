name: Collecte affluence Calicéo

on:
  schedule:
    # Toutes les 30 minutes, de 8h à 21h59 UTC (= 10h à 23h59 Paris en heure
    # d'été, 9h à 22h59 en heure d'hiver). Minutes décalées (7 et 37) pour
    # éviter les créneaux :00/:30, saturés chez GitHub (déclenchements sautés).
    # Le script collect.py filtre lui-même les heures réellement valides
    # selon le jour (voir sa "fenêtre de collecte").
    - cron: "7,37 8-21 * * *"
  workflow_dispatch: {}  # permet de lancer un relevé manuellement pour tester

permissions:
  contents: write

concurrency:
  group: collecte-affluence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Lancer le relevé
        run: python scripts/collect.py

      - name: Enregistrer le résultat si de nouvelles données existent
        run: |
          git config user.name "Collecteur Calicéo"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/readings.csv; then
            echo "Aucune nouvelle donnée à enregistrer."
          else
            git add data/readings.csv
            git commit -m "Relevé affluence $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
